build:
  docker:
    web: Dockerfile.heroku
run:
  web: sh -c 'export HOME=/app && npx tsx src/server/db/restore-remote.ts && npx tsx src/server/db/migrate.ts && (uvicorn main:app --host 127.0.0.1 --port 8000 --workers 1 --limit-concurrency 10 --log-level warning --app-dir /app/browser-use > /tmp/browser-use.log 2>&1 &) && exec npm run start'
